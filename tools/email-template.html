<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentBoot Email</title>
</head>
<body style="margin:0; padding:0; background-color:#050812;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#050812; margin:0; padding:26px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="640" style="max-width:640px; width:100%; background-color:#0d1224; border:1px solid #1d2744; border-radius:14px; overflow:hidden;">
          <tr>
            <td style="padding:18px 24px; background-color:#050812;" align="left">
              <img
                src="https://www.agentboot.co.uk/assets/header-logo-B_DfEA2k.jpg"
                alt="AgentBoot"
                style="display:block; width:auto; height:auto; border:0;"
              />
            </td>
          </tr>
          <tr>
            <td style="padding:24px 28px 0px 28px; font-family:Verdana, Arial, sans-serif; color:#eaf0ff; font-size:15px; line-height:1.65;">
              {{BODY}}
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 20px 28px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-top:1px solid #263357; margin:20px 0; padding-top:18px;">
                <tr>
                  <td style="font-family:Verdana, Arial, sans-serif; color:#eaf0ff; margin-top:20px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr style="padding-top:20px;">
                        <td style="vertical-align:top; padding:0 14px 0 0;">
                          <img
                            src="{{AGENT_PROFILE_PIC}}"
                            alt="{{AGENT_NAME}} Profile"
                            width="52"
                            height="52"
                            style="display:block; border:0; border-radius:50%; object-fit:cover;"
                          />
                        </td>
                        <td style="vertical-align:top;">
                          <div style="font-size:18px; font-weight:700; line-height:1.3;">{{AGENT_NAME}}</div>
                          <div style="margin-top:2px; font-size:12px; color:#8da1c8; line-height:1.4;">ID: {{AGENT_ID}}</div>
                          <div style="margin-top:4px; font-size:13px; color:#9db3df; line-height:1.4;">{{AGENT_TITLE}}</div>
                        </td>
                      </tr>
                    </table>
                    <div style="margin-top:12px; font-size:13px; line-height:1.6;">
                      <div><a href="https://www.agentboot.co.uk" style="color:#8cc0ff; text-decoration:none;">www.agentboot.co.uk</a></div>
                      <div><a href="mailto:{{AGENT_EMAIL}}" style="color:#8cc0ff; text-decoration:none;">{{AGENT_EMAIL}}</a></div>
                      <div><a href="{{AGENT_PROFILE_URL}}" style="color:#8cc0ff; text-decoration:none;">AgentBoot Profile</a></div>
                    </div>
                    <div style="margin-top:10px; font-size:12px; color:#8da1c8;">{{AGENT_BADGE}}</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 24px 6px 24px;">
              <img
                src="https://www.agentboot.co.uk/assets/footer-icon-80x80-CxmegBjy.jpg"
                alt="AgentBoot Footer Icon"
                width="28"
                height="28"
                style="display:block; border:0;"
              />
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 24px 16px 24px; font-family:Verdana, Arial, sans-serif; font-size:10px; line-height:1.4; color:#6f81a6;">
              Powered by AgentBoot<br>
              © 2026 AgentBoot Protocol. Building the future of AI autonomy.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
